#!/bin/bash
# =============================================================================
#  Configuration du déploiement — SEUL FICHIER À PERSONNALISER
#  Lu par setup-server.sh (et réutilisable par d'autres scripts).
#  Ne pas committer si tu y mets des valeurs sensibles → ajoute-le au .gitignore
# =============================================================================

# -- Domaine principal du SaaS, SANS sous-domaine. ----------------------------
#    Laisse vide tant que le nom n'est pas choisi : le script refusera de
#    s'exécuter et te le rappellera.
#    Exemples : "tarify.app"  |  "margeon.app"  |  "couteo.app"
BASE_DOMAIN="bougerolle.ovh"

# -- Adresse e-mail pour les certificats Let's Encrypt (expiration, sécurité).
ADMIN_EMAIL="ebougerolle@proton.me"

# -- Dépôt Git de l'application. ----------------------------------------------
REPO_URL="https://github.com/VOTRE-COMPTE/gestion-recettes.git"
# -- Branche Git par défaut (utilisée si aucun argument n'est passé à setup-server.sh).
#    master     → instance de dev  (sudo ./setup-server.sh demo)
#    production → instance client  (sudo ./setup-server.sh dupont production)
#    Conseil : garder "master" ici et passer la branche en argument pour les clients.
GIT_BRANCH="master"

# -- Nom technique de l'application (préfixe des sites nginx, logs, sudoers). --
APP_NAME="gestion-recettes"

# -- Racine où sont déployées les instances clients. --------------------------
#    Chaque client aura son propre dossier : $INSTALL_ROOT/<slug>
INSTALL_ROOT="/var/www/clients"

# -- Port du conteneur Gotenberg (génération PDF), partagé par tous les clients.
GOTENBERG_PORT="3000