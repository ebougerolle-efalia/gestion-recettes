doctrine:
    dbal:
        # Le driver est déduit du schéma de DATABASE_URL (postgresql://, sqlite:///…).
        # Ne pas le forcer ici : ce serait ignorer l'URL et casser tout changement
        # de moteur entre environnements.
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        auto_generate_proxy_classes: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
