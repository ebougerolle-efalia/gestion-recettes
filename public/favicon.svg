<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Balance à deux plateaux, dite balance Roberval : l'instrument de l'atelier
    qui pèse la matière, et la métaphore de ce que fait l'application — mettre
    le coût et le prix sur les deux plateaux.
    Tracé volontairement épais et sans détail : reste lisible à 16 px.
  -->
  <rect width="32" height="32" rx="6" fill="#1c2434"/>
  <g fill="none" stroke="#E3B558" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <!-- fléau -->
    <path d="M7 11h18"/>
    <!-- colonne et socle -->
    <path d="M16 11v11"/>
    <path d="M11.5 24h9"/>
    <!-- suspentes -->
    <path d="M9.5 11v1.5"/>
    <path d="M22.5 11v1.5"/>
    <!-- plateaux -->
    <path d="M6 13h7l-3.5 4.5z"/>
    <path d="M19 13h7l-3.5 4.5z"/>
  </g>
  <circle cx="16" cy="9.4" r="1.5" fill="#E3B558"/>
</svg>
